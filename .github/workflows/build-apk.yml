name: Build Native APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build & Sign Native APK
        run: |
          npm install -g cordova
          cordova create app com.rameshwar.calculatorpro "Calculator Pro"
          cp index.html app/www/index.html
          keytool -genkey -v -keystore release.keystore -alias calcpro -keyalg RSA -keysize 2048 -validity 10000 -storepass calc1234 -keypass calc1234 -dname "CN=Rameshwar, OU=Dev, O=CalculatorPro, L=Partur, ST=Maharashtra, C=IN"
          cd app
          cordova platform add android
          cordova build android --release -- --keystore=../release.keystore --storePassword=calc1234 --alias=calcpro --password=calc1234 --packageType=apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Pro-Signed-APK
          path: app/platforms/android/app/build/outputs/apk/release/app-release.apk
          
