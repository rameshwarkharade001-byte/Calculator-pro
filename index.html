<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Calculator Pro — Glass Ultra 55+ Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #050609;
      --glass-surface: rgba(255, 255, 255, 0.06);
      --glass-surface-strong: rgba(255, 255, 255, 0.11);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-top-edge: rgba(255, 255, 255, 0.25);
      --accent: #ff9500;
      --accent-soft: rgba(255, 149, 0, 0.22);
      --accent-glow: rgba(255, 149, 0, 0.5);
      --cyan: #38bdf8;
      --emerald: #10b981;
      --rose: #f43f5e;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-void);
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      position: relative;
    }

    /* Ambient Glassmorphism Glow Orbs */
    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.42;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }
    .orb-orange {
      width: 270px; height: 270px;
      background: radial-gradient(circle, #ff9500, transparent 70%);
      top: -50px; right: -40px;
    }
    .orb-blue {
      width: 310px; height: 310px;
      background: radial-gradient(circle, #2563eb, transparent 70%);
      bottom: 70px; left: -80px;
      animation-delay: -5s;
    }
    .orb-violet {
      width: 230px; height: 230px;
      background: radial-gradient(circle, #8b5cf6, transparent 70%);
      top: 40%; left: 32%;
      opacity: 0.24;
    }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-18px, 22px) scale(1.08); }
    }

    /* Main Glass App Frame */
    .app-frame {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: rgba(11, 13, 20, 0.56);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-left: 1px solid var(--glass-border);
      border-right: 1px solid var(--glass-border);
    }

    /* Top Glass Header */
    .glass-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.035);
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
      z-index: 20;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .app-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .pro-pill {
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 99px;
      background: linear-gradient(135deg, #ff9500, #ea580c);
      color: #000;
      letter-spacing: 0.4px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .glass-nav-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-top-color: var(--glass-top-edge);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: transform 0.14s ease, background 0.14s ease, border-color 0.14s ease;
    }
    .glass-nav-btn:active {
      transform: scale(0.91);
      background: var(--glass-surface-strong);
    }
    .glass-nav-btn.is-active {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 14px rgba(255, 149, 0, 0.28);
    }

    /* Main Viewport */
    .main-viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .main-viewport::-webkit-scrollbar { width: 4px; }
    .main-viewport::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
    }

    /* Reusable Glass Components for All 55+ Sessions */
    .g-card {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-top-color: var(--glass-top-edge);
      border-radius: 18px;
      padding: 14px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .g-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .g-input, .g-select {
      width: 100%;
      background: rgba(0, 0, 0, 0.38);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      outline: none;
      user-select: text;
      transition: border-color 0.2s;
    }
    .g-input:focus, .g-select:focus {
      border-color: var(--accent);
    }
    .g-btn-orange {
      background: linear-gradient(135deg, #ff9500, #ea580c);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--accent-glow);
      transition: transform 0.14s ease;
    }
    .g-btn-orange:active { transform: scale(0.96); }
    .g-btn-glass {
      background: var(--glass-surface-strong);
      color: var(--text-main);
      font-weight: 600;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .g-btn-glass:active { transform: scale(0.96); }

    /* Bottom Docked Adsterra 320x50 Banner (Non-Blocking & Crash-Free) */
    .bottom-ad-dock {
      width: 100%;
      height: 56px;
      background: rgba(4, 5, 8, 0.9);
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      z-index: 25;
    }
    .adsterra-320x50-iframe {
      width: 320px;
      height: 50px;
      border: none;
      overflow: hidden;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
    }
  </style>
</head>

  <div class="app-frame">

    <header class="glass-header">

  <!-- Safe Isolated Adsterra Loader (320x50 Banner + Delayed Non-Intrusive Social Bar) -->

    window.addEventListener('DOMContentLoaded', () => {
      // 1. Load 320x50 Banner inside isolated iframe so main calculator never crashes
      const bFrame = document.getElementById('adsterra-banner-slot');
      if (bFrame) {
        const d = bFrame.contentWindow.document;
        d.open();
        d.write(`
          <!DOCTYPE html><html><body style="margin:0;padding:0;background:transparent;display:flex;justify-content:center;align-items:center;overflow:hidden;">
            <script>
              atOptions = {

                'height' : 50,
                'width' : 320,
                'params' : {}

            <\/script>
            <script src="https://bauval.org/22/e2fb0481067ecb77e9c1a9e148e65c71"><\/script>
          </body></html>
        `);
        d.close();
      }

      // 2. Load Adsterra Social Bar after 3.5 seconds so initial app load & keypad stay ultra-smooth
      setTimeout(() => {
        const sb = document.createElement('script');
        sb.setAttribute('data-cfasync', 'false');
        sb.src = 'https://bauval.org/14/e0d9e140d2a95360f9f664cd9cdfcc54';
        sb.async = true;
        document.body.appendChild(sb);
      }, 3500);
    });
  </script>

  <!-- ==================== PART 2: MAIN GLASS CALCULATOR & HISTORY ==================== -->
<style>
  .calc-session {
    display: flex;
    flex-direction: column;

  /* Glass Display Screen */

<script>
  const CalcState = {
    expr: '',
    result: '0',
    isDeg: true,
    memory: 0,
    sciOpen: false,
    history: JSON.parse(localStorage.getItem('calc_pro_hist') || '[]'),
    currentView: 'calc' // 'calc' | 'hub' | 'tool'
  };

  // Tactile Sound Feedback
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playTapSound(freq = 520) {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    } catch (e) {}
  }

  function renderMainCalculator() {
    CalcState.currentView = 'calc';
    document.getElementById('nav-title').textContent = 'Calculator Pro';
    document.getElementById('nav-back-btn').style.display = 'none';
    document.getElementById('nav-sci-btn').style.display = 'flex';
    document.getElementById('nav-sci-btn').classList.toggle('is-active', CalcState.sciOpen);
    document.getElementById('nav-hub-btn').classList.remove('is-active');

    const vp = document.getElementById('app-viewport');
    vp.innerHTML = `
      <div class="calc-session">
        <div class="glass-display-box">
          <div class="display-meta-row">
            <div style="display:flex;gap:6px;align-items:center;">
              <button class="glass-chip accent" onclick="toggleDegRad()">${CalcState.isDeg ? 'DEG' : 'RAD'}</button>
              <span id="mem-badge" style="font-size:10px;color:var(--cyan);font-weight:700;">${CalcState.memory !== 0 ? 'M=' + CalcState.memory : ''}</span>
            </div>
            <div class="mem-pills">
              <button class="mem-btn" onclick="memOp('MC')">MC</button>
              <button class="mem-btn" onclick="memOp('MR')">MR</button>
              <button class="mem-btn" onclick="memOp('M+')">M+</button>
              <button class="mem-btn" onclick="memOp('M-')">M-</button>
            </div>
          </div>
          <div>
            <div id="calc-expr" class="expr-line">${CalcState.expr || ''}</div>
            <div id="calc-result" class="result-line">${CalcState.result}</div>
            <div id="calc-preview" class="live-preview"></div>
          </div>
        </div>

        <div id="sci-drawer" class="sci-drawer ${CalcState.sciOpen ? 'open' : ''}">
          <button class="sci-key" onclick="appendToken('sin(')">sin</button>
          <button class="sci-key" onclick="appendToken('cos(')">cos</button>
          <button class="sci-key" onclick="appendToken('tan(')">tan</button>
          <button class="sci-key" onclick="appendToken('log(')">log</button>
          <button class="sci-key" onclick="appendToken('ln(')">ln</button>
          <button class="sci-key" onclick="appendToken('asin(')">sin⁻¹</button>
          <button class="sci-key" onclick="appendToken('acos(')">cos⁻¹</button>
          <button class="sci-key" onclick="appendToken('atan(')">tan⁻¹</button>
          <button class="sci-key" onclick="appendToken('√(')">√x</button>
          <button class="sci-key" onclick="appendToken('^')">xʸ</button>
          <button class="sci-key" onclick="appendToken('(')">(</button>
          <button class="sci-key" onclick="appendToken(')')">)</button>
          <button class="sci-key" onclick="appendToken('π')">π</button>
          <button class="sci-key" onclick="appendToken('e')">e</button>
          <button class="sci-key" onclick="appendToken('!')">n!</button>
        </div>

        <div class="keypad-grid">
          <button class="g-key fn-key" onclick="clearCalc()">AC</button>
          <button class="g-key fn-key" onclick="appendToken('%')">%</button>
          <button class="g-key fn-key" onclick="backspaceCalc()" aria-label="Backspace">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/>
            </svg>
          </button>
          <button class="g-key op-key" onclick="appendToken('÷')">÷</button>

          <button class="g-key" onclick="appendToken('7')">7</button>
          <button class="g-key" onclick="appendToken('8')">8</button>
          <button class="g-key" onclick="appendToken('9')">9</button>
          <button class="g-key op-key" onclick="appendToken('×')">×</button>

          <button class="g-key" onclick="appendToken('4')">4</button>
          <button class="g-key" onclick="appendToken('5')">5</button>
          <button class="g-key" onclick="appendToken('6')">6</button>
          <button class="g-key op-key" onclick="appendToken('-')">−</button>

          <button class="g-key" onclick="appendToken('1')">1</button>
          <button class="g-key" onclick="appendToken('2')">2</button>
          <button class="g-key" onclick="appendToken('3')">3</button>
          <button class="g-key op-key" onclick="appendToken('+')">+</button>

          <button class="g-key" onclick="appendToken('00')">00</button>
          <button class="g-key" onclick="appendToken('0')">0</button>
          <button class="g-key" onclick="appendToken('.')">.</button>
          <button class="g-key eq-key" onclick="evaluateCalc()">=</button>
        </div>
      </div>

      <!-- History Tape Overlay -->

          <h3 style="font-size:16px;font-weight:700;">Calculation History</h3>
          <div style="display:flex;gap:8px;">
            <button class="g-btn-glass" style="padding:6px 10px;font-size:12px;color:var(--rose);" onclick="clearHistory()">Clear</button>
            <button class="g-btn-glass" style="padding:6px 10px;font-size:12px;" onclick="toggleHistoryPanel()">Close</button>
          </div>
        </div>
        <div id="history-list" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    `;
    updateLivePreview();
  }

  function safeMathEval(rawExpr) {
    if (!rawExpr) return null;
    let s = rawExpr
      .replace(/×/g, '*')
      .replace(/÷/g, '/')
      .replace(/−/g, '-')
      .replace(/π/g, 'Math.PI')
      .replace(/\be\b/g, 'Math.E')
      .replace(/√\(/g, 'Math.sqrt(')
      .replace(/\^/g, '**')
      .replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');

    // Factorial handler
    s = s.replace(/(\d+)!/g, (_, n) => {
      let num = parseInt(n, 10);
      if (num > 170) return 'Infinity';
      let f = 1;
      for (let i = 2; i <= num; i++) f *= i;
      return f;
    });

    const toRad = CalcState.isDeg ? '(Math.PI/180)*' : '';
    const fromRad = CalcState.isDeg ? '(180/Math.PI)*' : '';
    s = s
      .replace(/\basin\(/g, `(${fromRad}Math.asin(`)
      .replace(/\bacos\(/g, `(${fromRad}Math.acos(`)
      .replace(/\batan\(/g, `(${fromRad}Math.atan(`)
      .replace(/\bsin\(/g, `Math.sin(${toRad}`)
      .replace(/\bcos\(/g, `Math.cos(${toRad}`)
      .replace(/\btan\(/g, `Math.tan(${toRad}`)
      .replace(/\blog\(/g, 'Math.log10(')
      .replace(/\bln\(/g, 'Math.log(');

    // Auto-close missing parentheses
    const openCount = (s.match(/\(/g) || []).length;
    const closeCount = (s.match(/\)/g) || []).length;
    if (openCount > closeCount) s += ')'.repeat(openCount - closeCount);

    const val = Function('"use strict";return (' + s + ')')();
    if (typeof val !== 'number' || isNaN(val)) return null;
    return Number.isInteger(val) ? val.toString() : parseFloat(val.toFixed(10)).toString();
  }

  function appendToken(tok) {
    playTapSound(520);
    CalcState.expr += tok;
    document.getElementById('calc-expr').textContent = CalcState.expr;
    updateLivePreview();
  }

  function clearCalc() {
    playTapSound(360);
    CalcState.expr = '';
    CalcState.result = '0';
    document.getElementById('calc-expr').textContent = '';
    document.getElementById('calc-result').textContent = '0';
    document.getElementById('calc-preview').textContent = '';
  }

  function backspaceCalc() {
    playTapSound(420);
    CalcState.expr = CalcState.expr.slice(0, -1);
    document.getElementById('calc-expr').textContent = CalcState.expr;
    updateLivePreview();
  }

  function updateLivePreview() {
    const prevEl = document.getElementById('calc-preview');
    if (!prevEl) return;
    try {
      const res = safeMathEval(CalcState.expr);
      prevEl.textContent = (res !== null && res !== CalcState.expr) ? '= ' + res : '';
    } catch (e) {
      prevEl.textContent = '';
    }
  }

  function evaluateCalc() {
    playTapSound(680);
    try {
      const res = safeMathEval(CalcState.expr);
      if (res !== null) {
        CalcState.history.unshift({ expr: CalcState.expr, res });
        if (CalcState.history.length > 40) CalcState.history.pop();
        localStorage.setItem('calc_pro_hist', JSON.stringify(CalcState.history));
        CalcState.result = res;
        document.getElementById('calc-result').textContent = res;
        document.getElementById('calc-preview').textContent = '';
        CalcState.expr = res;
      }
    } catch (e) {
      document.getElementById('calc-result').textContent = 'Syntax Error';
    }
  }

  function toggleDegRad() {
    playTapSound(560);
    CalcState.isDeg = !CalcState.isDeg;
    renderMainCalculator();
  }

  function toggleSciDrawer() {
    playTapSound(560);
    if (CalcState.currentView !== 'calc') renderMainCalculator();
    CalcState.sciOpen = !CalcState.sciOpen;
    const dr = document.getElementById('sci-drawer');
    if (dr) dr.classList.toggle('open', CalcState.sciOpen);
    document.getElementById('nav-sci-btn').classList.toggle('is-active', CalcState.sciOpen);
  }

  function memOp(op) {
    playTapSound(480);
    const cur = parseFloat(CalcState.result) || 0;
    if (op === 'MC') CalcState.memory = 0;
    if (op === 'MR') { CalcState.expr += CalcState.memory.toString(); document.getElementById('calc-expr').textContent = CalcState.expr; updateLivePreview(); }
    if (op === 'M+') CalcState.memory += cur;
    if (op === 'M-') CalcState.memory -= cur;
    const mb = document.getElementById('mem-badge');
    if (mb) mb.textContent = CalcState.memory !== 0 ? 'M=' + CalcState.memory : '';
  }

  function toggleHistoryPanel() {
    playTapSound(500);
    if (CalcState.currentView !== 'calc') renderMainCalculator();
    const ov = document.getElementById('history-overlay');
    const isOpen = ov.classList.toggle('open');
    if (isOpen) {
      const list = document.getElementById('history-list');
      list.innerHTML = CalcState.history.length === 0
        ? '<p style="color:var(--text-dim);text-align:center;margin-top:40px;font-size:13px;">No calculations yet.</p>'

            </div>
          `).join('');
    }
  }

  function recallHistory(val) {

    if (CalcState.currentView === 'tool') {
      openToolsHub();
    } else {
      renderMainCalculator();
    }
  }

    border: 1px solid rgba(255, 149, 0, 0.35);
    border-radius: 20px;
    padding: 16px;
    text-align: center;
  }
  .hero-sub { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.7px; }
  .hero-val { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 800; color: var(--accent); margin: 4px 0; }
  .hero-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  .hero-mini {
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 8px;
  }
  .hero-mini span { display: block; font-size: 10px; color: var(--text-dim); }
  .hero-mini strong { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; color: #fff; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .slab-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .slab-btn {
    flex: 1;
    padding: 8px 4px;
    border-radius: 10px;
    background: var(--glass-surface);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .slab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .split-bar {
    height: 10px;
    border-radius: 99px;
    background: rgba(255,255,255,0.1);
    overflow: hidden;
    display: flex;
    margin-top: 10px;
  }
</style>

<script>
  const ToolSessions = {};

  function fmtINR(n) {
    if (!isFinite(n) || isNaN(n)) return '₹0';
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }
  function fmtNum(n, d = 2) {
    if (!isFinite(n) || isNaN(n)) return '0';
    return Number(n.toFixed(d)).toLocaleString('en-IN');
  }

  function launchToolSession(toolId) {
    playTapSound(580);
    const meta = ALL_TOOLS_CATALOG.find(t => t.id === toolId);
    if (!meta) return;

    CalcState.currentView = 'tool';
    document.getElementById('nav-title').textContent = meta.name;
    document.getElementById('nav-back-btn').style.display = 'flex';
    document.getElementById('nav-sci-btn').style.display = 'none';
    document.getElementById('nav-hub-btn').classList.remove('is-active');

    const vp = document.getElementById('app-viewport');
    vp.scrollTop = 0;

    if (ToolSessions[toolId]) {
      ToolSessions[toolId](vp, meta);
    } else {
      vp.innerHTML = `<div class="tool-session-wrap"><div class="g-card"><p>Loading ${meta.name}...</p></div></div>`;
    }
  }

  // 1. Loan & EMI Planner
  ToolSessions.emi = (vp) => {
    vp.innerHTML = `
      <div class="tool-session-wrap">
        <div class="session-hero">
          <div class="hero-sub">Monthly Loan EMI</div>
          <div id="emi-monthly" class="hero-val">₹8,792</div>
          <div class="split-bar">
            <div id="emi-bar-p" style="width:75%;background:#38bdf8;"></div>
            <div id="emi-bar-i" style="width:25%;background:#ff9500;"></div>
          </div>
          <div class="hero-grid">
            <div class="hero-mini"><span>Total Interest</span><strong id="emi-int" style="color:var(--accent);">₹54,992</strong></div>
            <div class="hero-mini"><span>Total Payable</span><strong id="emi-tot">₹5,54,992</strong></div>
          </div>
        </div>
        <div class="g-card" style="display:flex;flex-direction:column;gap:10px;">
          <div><label class="g-label">Loan Amount (₹)</label><input id="emi-p" class="g-input" type="number" value="500000" oninput="calcEMI()"></div>
          <div class="field-row">
            <div><label class="g-label">Interest Rate (% p.a.)</label><input id="emi-r" class="g-input" type="number" step="0.1" value="9.5" oninput="calcEMI()"></div>
            <div><label class="g-label">Tenure (Years)</label><input id="emi-y" class="g-input" type="number" value="6" oninput="calcEMI()"></div>
          </div>
        </div>
        <div class="g-card">
          <div class="g-label">Yearly Schedule Preview</div>
          <div id="emi-sched" style="font-family:'JetBrains Mono',monospace;font-size:11.5px;display:flex;flex-direction:column;gap:5px;margin-top:6px;"></div>
        </div>
      </div>`;
    window.calcEMI = () => {
      const P = parseFloat(document.getElementById('emi-p').value) || 0;
      const annualR = parseFloat(document.getElementById('emi-r').value) || 0;
      const yrs = parseFloat(document.getElementById('emi-y').value) || 1;
      const n = Math.max(1, Math.round(yrs * 12));
      const r = annualR / 12 / 100;
      const emi = r === 0 ? P / n : (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
      const total = emi * n;
      const interest = total - P;
      document.getElementById('emi-monthly').textContent = fmtINR(emi);
      document.getElementById('emi-int').textContent = fmtINR(interest);
      document.getElementById('emi-tot').textContent = fmtINR(total);
      const pPct = total > 0 ? Math.min(100, (P / total) * 100) : 100;
      document.getElementById('emi-bar-p').style.width = pPct + '%';
      document.getElementById('emi-bar-i').style.width = (100 - pPct) + '%';

      let bal = P, rows = '';
      for (let y = 1; y <= Math.min(15, Math.ceil(yrs)); y++) {
        for (let m = 0; m < 12 && (y - 1) * 12 + m < n; m++) {
          const intM = bal * r;
          bal = Math.max(0, bal - (emi - intM));
        }
        rows += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.06);"><span>Year ${y} Balance</span><span style="color:var(--cyan);">${fmtINR(bal)}</span></div>`;
      }
      document.getElementById('emi-sched').innerHTML = rows;
    };
    calcEMI();
  };

  // 2. SIP Wealth Planner
  ToolSessions.sip = (vp) => {
    vp.innerHTML = `
      <div class="tool-session-wrap">
        <div class="session-hero">
          <div class="hero-sub">Estimated Future Wealth</div>
          <div id="sip-tot" class="hero-val">₹11,61,695</div>
          <div class="hero-grid">
            <div class="hero-mini"><span>Invested Amount</span><strong id="sip-inv">₹6,00,000</strong></div>
            <div class="hero-mini"><span>Wealth Gained</span><strong id="sip-gain" style="color:var(--emerald);">₹5,61,695</strong></div>
          </div>
        </div>
        <div class="g-card" style="display:flex;flex-direction:column;gap:10px;">
          <div><label class="g-label">Monthly SIP Amount (₹)</label><input id="sip-m" class="g-input" type="number" value="5000" oninput="calcSIP()"></div>
          <div class="field-row">
            <div><label class="g-label">Expected Return (% p.a.)</label><input id="sip-r" class="g-input" type="number" step="0.5" value="12" oninput="calcSIP()"></div>
            <div><label class="g-label">Duration (Years)</label><input id="sip-y" class="g-input" type="number" value="10" oninput="calcSIP()"></div>
          </div>
        </div>
      </div>`;
    window.calcSIP = () => {
      const m = parseFloat(document.getElementById('sip-m').value) || 0;
      const r = (parseFloat(document.getElementById('sip-r').value) || 0) / 12 / 100;
      const n = (parseFloat(document.getElementById('sip-y').value) || 0) * 12;
      const fv = r === 0 ? m * n : m * ((Math.pow(1 + r, n) - 1) / r) * (1 + r);
      const inv = m * n;
      document.getElementById('sip-tot').textContent = fmtINR(fv);
      document.getElementById('sip-inv').textContent = fmtINR(inv);
      document.getElementById('sip-gain').textContent = fmtINR(fv - inv);
    };
    calcSIP();
  };

  // 3. Lumpsum & FD/RD
  ToolSessions.lumpsum = (vp) => {
    vp.innerHTML = `
      <div class="tool-session-wrap">
        <div class="session-hero">
          <div class="hero-sub">Maturity Value</div>
          <div id="fd-mat" class="hero-val">₹1,41,852</div>
          <div class="hero-grid">
            <div class="hero-mini"><span>Principal</span><strong id="fd-prin">₹1,00,000</strong></div>
            <div class="hero-mini"><span>Interest Earned</span><strong id="fd-int" style="color:var(--emerald);">₹41,852</strong></div>
          </div>
        </div>
        <div class="g-card" style="display:flex;flex-direction:column;gap:10px;">
          <div><label class="g-label">Deposit Amount (₹)</label><input id="fd-p" class="g-input" type="number" value="100000" oninput="calcFD()"></div>
          <div class="field-row">
            <div><label class="g-label">Interest Rate (% p.a.)</label><input id="fd-r" class="g-input" type="number" step="0.1" value="7.1" oninput="calcFD()"></div>
            <div><label class="g-label">Years</label><input id="fd-t" class="g-input" type="number" value="5" oninput="calcFD()"></div>
          </div>
        </div>
      </div>`;
    window.calcFD = () => {
      const p = parseFloat(document.getElementById('fd-p').value) || 0;
      const r = (parseFloat(document.getElementById('fd-r').value) || 0) / 100;
      const t = parseFloat(document.getElementById('fd-t').value) || 0;
      const mat = p * Math.pow(1 + r / 4, 4 * t);
      document.getElementById('fd-mat').textContent = fmtINR(mat);
      document.getElementById('fd-prin').textContent = fmtINR(p);
      document.getElementById('fd-int').textContent = fmtINR(mat - p);
    };
    calcFD();
  };

  // 4. Compound Interest
  ToolSessions.ci = (vp) => {
    vp.innerHTML = `
      <div class="tool-session-wrap">
        <div class="session-hero">
          <div class="hero-sub">Compounded Total</div>
          <div id="ci-tot" class="hero-val">₹0</div>
          <div class="hero-grid">
            <div class="hero-mini"><span>Interest</span><strong id="ci-int" style="color:var(--accent);">₹0</strong></div>
            <div class="hero-mini"><span>Effective APY</span><strong id="ci-apy">0%</strong></div>
          </div>
        </div>
        <div class="g-card" style="display:flex;flex-direction:column;gap:10px;">
          <div><label class="g-label">Principal (₹)</label><input id="ci-p" class="g-input" type="number" value="50000" oninput="calcCI()"></div>
          <div class="field-row">
            <div><label class="g-label">Annual Rate (%)</label><input id="ci-r" class="g-input" type="number" value="10" oninput="calcCI()"></div>
            <div><label class="g-label">Years</label><input id="ci-t" class="g-input" type="number" value="5" oninput="calcCI()"></div>
          </div>
          <div><label class="g-label">Compounding Frequency</label>
            <select id="ci-n" class="g-select" onchange="calcCI()">
              <option value="1">Annually (1x)</option>
              <option value="4">Quarterly (4x)</option>
              <option value="12" selected>Monthly (12x)</option>
              <option value="365">Daily (365x)</option>
            </select>
          </div>
        </div>
      </div>`;
    window.calcCI = () => {
      const p = parseFloat(document.getElementById('ci-p').value) || 0;
      const r = (parseFloat(document.getElementById('ci-r').value) || 0) / 100;
      const t = parseFloat(document.getElementById('ci-t').value) || 0;
      const n = parseFloat(document.getElementById('ci-n').value) || 1;
      const amt = p * Math.pow(1 + r / n, n * t);
      const apy = (Math.pow(1 + r / n, n) - 1) * 100;
      document.getElementById('ci-tot').textContent = fmtINR(amt);
      document.getElementById('ci-int').textContent = fmtINR(amt - p);
      document.getElementById('ci-apy').textContent = apy.toFixed(2) + '%';
    };
    calcCI();
  };

  // 5. GST & Tax Splitter
  ToolSessions.gst = (vp) => {
    let gstRate = 18;
    let gstMode = 'add';
    vp.innerHTML = `
      <div class="tool-session-wrap">
        <div class="session-hero">
          <div class="hero-sub">Final Invoice Amount</div>
          <div id="gst-final" class="hero-val">₹1,180.00</div>
          <div class="hero-grid">
            <div class="hero-mini"><span>Base Price</span><strong id="gst-base">₹1,000.00</strong></div>
            <div class="hero-mini"><span>Total GST</span><strong id="gst-tax" style="color:var(--accent);">₹180.00</strong></div>
            <div class="hero-mini"><span>CGST (50%)</span><strong id="gst-cgst">₹90.00</strong></div>
            <div class="hero-mini"><span>SGST (50%)</span><strong id="gst-sgst">₹90.00</strong></div>
          </div>
        </div>
        <div class="g-card" style="display:flex;flex-direction:column;gap:12px;">
          <div><label class="g-label">Amount (₹)</label><input id="gst-amt" class="g-input" type="number" value="1000" oninput="calcGST()"></div>
          <div>
            <label class="g-label">GST Slab</label>
            <div class="slab-row" id="gst-slabs">
              ${[3, 5, 12, 18, 28].map(s => `<button class="slab-btn ${s === 18 ? 'active' : ''}" onclick="setGstSlab(${s}, this)">${s}%</button>`).join('')}
            </div>
          </div>
          <div class="field-row">
            <button id="gst-m-add" class="g-btn-orange" onclick="setGstMode('add')">+ Add GST (Exclusive)</button>
            <button id="gst-m-rem" class="g-btn-glass" onclick="setGstMode('rem')">− Remove GST (Inclusive)</button>
          </div>
        </div>
      </div>`;
    window.setGstSlab = (s, btn) => {
      gstRate = s;
      document.querySelectorAll('#gst-slabs .slab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calcGST();
    };
    window.setGstMode = (m) => {
      gstMode = m;
      document.getElementById('gst-m-add').className = m === 'add' ? 'g-btn-orange' : 'g-btn-glass';
      document.getElementById('gst-m-rem').className = m === 'rem' ? 'g-btn-orange' : 'g-btn-glass';
      calcGST();
    };
    window.calcGST = () => {
      const a = parseFloat(document.getElementById('gst-amt').value) || 0;
      let base, tax, final;
      if (gstMode === 'add') {
        base = a;
        tax = a * (gstRate / 100);
        final = base + tax;
      } else {
        final = a;
        base = a / (1 + gstRate / 100);
        tax = final - base;
      }
      document.getElementById('gst-final').textContent = '₹' + fmtNum(final);
      document.getElementById('gst-base').textContent = '₹' + fmtNum(base);
      document.getElementById('gst-tax').textContent = '₹' + fmtNum(tax);
      document.getElementById('gst-cgst').textContent = '₹' + fmtNum(tax / 2);
      document.getElementById('gst-sgst').textContent = '₹' + fmtNum(tax / 2);
    };
    calcGST();
  };

  // 6. Smart Discount
  ToolSessions.discount = (vp) => {
    vp.innerHTML = `
      <div class="tool-session-wrap">
        <div class="session-hero">
          <div class="hero-sub">Payable Price After Discount</div>
          <div id="disc-pay" class="hero-val">₹1,520</div>
          <div class="hero-grid">
            <div class="hero-mini"><span>You Save</span><strong id="disc-save" style="color:var(--emerald);">₹480</strong></div>
            <div class="hero-mini"><span>Effective Off</span><strong id="disc-eff">24%</strong></div>
          </div>
        </div>
        <div class="g-card" style="display:flex;flex-direction:column;gap:10px;">
          <div><label class="g-label">Original MRP (₹)</label><input id="disc-mrp" class="g-input" type="number" value="2000" oninput="calcDisc()"></div>
          <div class="field-row">
            <div><label class="g-label">Discount 1 (%)</label><input id="disc-d1" class="g-input" type="number" value="20" oninput="calcDisc()"></div>
            <div><label class="g-label">Extra Off (%)</label><input id="disc-d2" class="g-input" type="number" value="5" oninput="calcDisc()"></div>
          </div>
        </div>
      </div>`;
    window.calcDisc = () => {
      const mrp = parseFloat(document.getElementById('disc-mrp').value) || 0;
      const d1 = parseFloat(document.getElementById('disc-d1').value) || 0;
      const d2 = parseFloat(document.getElementById('disc-d2').value) || 0;
      const after1 = mrp * (1 - d1 / 100);
      const final = after1 * (1 - d2 / 100);
      const saved = mrp - final;
      const eff = mrp > 0 ? (saved / mrp) * 100 : 0;
      document.getElementById('disc-pay').textContent = fmtINR(final);
      document.getElementById('disc-save').textContent = fmtINR(saved);
      document.getElementById('disc-eff').textContent = eff.toFixed(1) + '%';
    };
    calcDisc();
  };

  // 7. Profit Margin & Markup
  ToolSessions.margin = (vp) => {
    vp.innerHTML = `
      <div class="tool-session-wrap">
        <div class="session-hero">
          <div class="hero-sub">Net Profit Per Unit</div>
          <div id="mrg-prof" class="hero-val">₹350</div>
          <div class="hero-grid">
            <div class="hero-mini"><span>Gross Margin</span><strong id="mrg-pct" style="color:var(--emerald);">29.17%</strong></div>
            <div class="hero-mini"><span>Markup %</span><strong id="mrg-mkp" style="color:var(--cyan);">41.18%</strong></div>
          </div>
        </div>
        <div class="g-card" style="display:flex;flex-direction:column;gap:10px;">
          <div class="field-row">
            <div><label class="g-label">Cost Price (₹)</label><input id="mrg-cp" class="g-input" type="number" value="850" oninput="calcMrg()"></div>
            <div><label class="g-label">Selling Price (₹)</label><input id="mrg-sp" class="g-input" type="number" value="1200" oninput="calcMrg()"></div>
          </div>
        </div>
      </div>`;
    window.calcMrg = () => {
      const cp = parseFloat(document.getElementById('mrg-cp').value) || 0;
      const sp = parseFloat(document.getElementById('mrg-sp').value) || 0;
      const prof = sp - cp;
      const margin = sp > 0 ? (prof / sp) * 100 : 0;
      const markup = cp > 0 ? (prof / cp) * 100 : 0;
      document.getElementById('mrg-prof').textContent = fmtINR(prof);
      document.getElementById('mrg-pct').textContent = margin.toFixed(2) + '%';
      document.getElementById('mrg-mkp').textContent = markup.toFixed(2) + '%';
    };
    calcMrg();
  };

  // 8. World Currency Converter
  ToolSessions.currency = (vp) => {
    const rates = { INR: 1, USD: 84.4, EUR: 91.2, GBP: 108.5, AED: 22.98, SAR: 22.5, JPY: 0.55, AUD: 55.4, CAD: 60.8, SGD: 63.1 };
    const opts = Object.keys(rates).map(c => `<option value="${c}">${c}</option>`).join('');
    vp.innerHTML = `
      <div class="tool-session-wrap">
        <div class="session-hero">
          <div class="hero-sub">Converted Value</div>
          <div id="fx-out" class="hero-val">₹8,440.00</div>
        </div>
        <div class="g-card" style="display:flex;flex-direction:column;gap:10px;">
          <div><label class="g-label">Amount</label><input id="fx-amt" class="g-input" type="number" value="100" oninput="calcFX()"></div>
          <div class="field-row">
            <div><label class="g-label">From</label><select id="fx-from" class="g-select" onchange="calcFX()">${opts}</select></div>
            <div><label class="g-label">To</label><select id="fx-to" class="g-select" onchange="calcFX()">${opts}</select></div>
          </div>
        </div>
        <div id="fx-all" class="g-card" style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;"></div>
      </div>`;
    document.getElementById('fx-from').value = 'USD';
    document.getElementById('fx-to').value = 'INR';
    window.calcFX = () => {
      const amt = parseFloat(document.getElementById('fx-amt').value) || 0;
      const f = document.getElementById('fx-from').value;
      const t = document.getElementById('fx-to').value;
      const inINR = amt * rates[f];
      const res = inINR / rates[t];
      document.getElementById('fx-out').textContent = `${fmtNum(res, 2)} ${t}`;
            document.getElementById('fx-all').innerHTML = Object.keys(rates).map(k => `
        <div class="hero-mini"><span>${k}</span><strong>${fmtNum(inINR / rates[k], 2)}</strong></div>
      `).join('');
    };
    calcFX();
  };

  // 9. Bill Split & Tip
  ToolSessions.tip = (vp) => {
    vp.innerHTML = `
      <div class="tool-session-wrap">
        <div class="session-hero">
          <div class="hero-sub">Per Person Split</div>
          <div id="tip-per" class="hero-val">₹440</div>
          <div class="hero-grid">
            <div class="hero-mini"><span>Tip Amount</span><strong id="tip-amt">₹160</strong></div>
            <div class="hero-mini"><span>Grand Total</span><strong id="tip-tot">₹1,760</strong></div>
          </div>
        </div>
        <div class="g-card" style="display:flex;flex-direction:column;gap:10px;">
          <div><label class="g-label">Total Bill (₹)</label><input id="tip-bill" class="g-input" type="number" value="1600" oninput="calcTip()"></div>
          <div class="field-row">
            <div><label class="g-label">Tip (%)</label><input id="tip-pct" class="g-input" type="number" value="10" oninput="calcTip()"></div>
            <div><label class="g-label">People</label><input id="tip-ppl" class="g-input" type="number" value="4" min="1" oninput="calcTip()"></div>
          </div>
        </div>
      </div>`;
    window.calcTip = () => {
      const b = parseFloat(document.getElementById('tip-bill').value) || 0;
      const p = parseFloat(document.getElementById('tip-pct').value) || 0;
      const n = Math.max(1, parseInt(document.getElementById('tip-ppl').value) || 1);
      const tip = b * (p / 100);
      const tot = b + tip;
      document.getElementById('tip-per').textContent = fmtINR(tot / n);
      document.getElementById('tip-amt').textContent = fmtINR(tip);
      document.getElementById('tip-tot').textContent = fmtINR(tot);
    };
    calcTip();
  };

  // 10. ROI & CAGR
  ToolSessions.roi = (vp) => {
    vp.innerHTML = `
      <div class="tool-session-wrap">
        <div class="session-hero">
          <div class="hero-sub">CAGR (Annualized Growth)</div>
          <div id="roi-cagr" class="hero-val">14.87%</div>
          <div class="hero-grid">
            <div class="hero-mini"><span>Total ROI</span><strong id="roi-tot" style="color:var(--emerald);">100.0%</strong></div>
            <div class="hero-mini"><span>Net Profit</span><strong id="roi-net">₹50,000</strong></div>
          </div>
        </div>
        <div class="g-card" style="display:flex;flex-direction:column;gap:10px;">
          <div class="field-row">
            <div><label class="g-label">Initial Invest (₹)</label><input id="roi-i" class="g-input" type="number" value="50000" oninput="calcROI()"></div>
            <div><label class="g-label">Final Value (₹)</label><input id="roi-f" class="g-input" type="number" value="100000" oninput="calcROI()"></div>
          </div>

<!-- ==================== PART 5: 22 MATH, SCIENCE & ENGINEERING SESSIONS ==================== -->
<script>
  // 15. Interactive Function Grapher
  ToolSessions.grapher = (vp) => {
    let scale = 30;
    vp.innerHTML = `
      <div class="tool-session-wrap">
        <div class="g-card" style="padding:10px;">
          <canvas id="graph-canvas" width="400" height="250" style="width:100%;height:230px;border-radius:12px;background:rgba(0,0,0,0.45);display:block;"></canvas>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
            <span id="graph-coord" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);">Touch curve to trace</span>
            <div style="display:flex;gap:6px;">
              <button class="g-btn-glass" style="padding:5px 10px;" onclick="zoomGraph(1.25)">+</button>
              <button class="g-btn-glass" style="padding:5px 10px;" onclick="zoomGraph(0.8)">−</button>
            </div>
          </div>
        </div>
        <div class="g-card" style="display:flex;flex-direction:column;gap:8px;">
          <div><label class="g-label" style="color:#ff9500;">f₁(x) Orange Curve</label><input id="fn1" class="g-input" value="sin(x) * 2" oninput="drawGraph()"></div>
          <div><label class="g-label" style="color:#38bdf8;">f₂(x) Cyan Curve</label><input id="fn2" class="g-input" value="0.25 * x^2 - 2" oninput="drawGraph()"></div>
        </div>
      </div>`;
    const evalFn = (expr, x) => {
      if (!expr.trim()) return NaN;
      const s = expr.replace(/\^/g, '**').replace(/sin/g, 'Math.sin').replace(/cos/g, 'Math.cos').replace(/tan/g, 'Math.tan').replace(/sqrt/g, 'Math.sqrt').replace(/log/g, 'Math.log10').replace(/ln/g, 'Math.log').replace(/abs/g, 'Math.abs').replace(/pi/gi, 'Math.PI');
      try { return Function('x', 'return (' + s + ')')(x); } catch (e) { return NaN; }
    };
    window.zoomGraph = (f) => { scale = Math.max(8, Math.min(120, scale * f)); drawGraph(); };
    window.drawGraph = () => {
      const c = document.getElementById('graph-canvas');
      if (!c) return;
      const ctx = c.getContext('2d');
      const w = c.width, h = c.height, cx = w / 2, cy = h / 2;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      for (let x = cx % scale; x < w; x += scale) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
      for (let y = cy % scale; y < h; y += scale) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();

      const plot = (expr, color) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        let started = false;
        for (let px = 0; px <= w; px += 2) {
          const x = (px - cx) / scale;
          const y = evalFn(expr, x);
          const py = cy - y * scale;
          if (isFinite(y) && Math.abs(py) < 2000) {
            if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
          } else started = false;
        }
        ctx.stroke();
      };
      plot(document.getElementById('fn1').value, '#ff9500');
      plot(document.getElementById('fn2').value, '#38bdf8');
    };
    const cEl = document.getElementById('graph-canvas');
    cEl.addEventListener('pointermove', (e) => {
      const rect = cEl.getBoundingClientRect();
      const px = ((e.clientX - rect.left) / rect.width) * cEl.width;
      const x = (px - cEl.width / 2) / scale;
      const y1 = evalFn(document.getElementById('fn1').value, x);
      document.getElementById('graph-coord').textContent = `x=${x.toFixed(2)}, f₁(x)=${isFinite(y1) ? y1.toFixed(2) : 'undef'}`;
    });
    drawGraph();
  };

  // 16. Matrix Solver (2x2 & 3x3)
  ToolSessions.matrix = (vp) => {
    let dim = 3;
    vp.innerHTML = `
      <div class="tool-session-wrap">

        </div>

          <div class="field-row">

            <button class="g-btn-orange" onclick="setMatDim(3)">3×3 Matrix</button>
          </div>
          <div id="mat-grid" style="display:grid;gap:6px;"></div>
          <div class="field-row">
            <button class="g-btn-orange" onclick="solveMat('det')">Determinant & Inverse</button>
            <button class="g-btn-glass" onclick="solveMat('trans')">Transpose Aᵀ</button>
          </div>
        </div>
      </div>`;
    window.setMatDim = (d) => {
      dim = d;
      const g = document.getElementById('mat-grid');
      g.style.gridTemplateColumns = `repeat(${d}, 1fr)`;
      const def = d === 2 ? [4, 7, 2, 6] : [2, 1, 3, 0, 4, -1, 5, 2, 1];
      g.innerHTML = Array.from({ length: d * d }, (_, i) => `<input id="mc-${i}" class="g-input" style="text-align:center;padding:8px;" type="number" value="${def[i] || 0}">`).join('');
      solveMat('det');
    };
    window.solveMat = (mode) => {
      const m = [];
      for (let r = 0; r < dim; r++) {
        m[r] = [];
        for (let c = 0; c < dim; c++) m[r][c] = parseFloat(document.getElementById(`mc-${r * dim + c}`).value) || 0;
      }
      if (mode === 'trans') {
        const t = m[0].map((_, c) => m.map(r => r[c]).join('  ')).join('\n');
        document.getElementById('mat-out').textContent = 'Transpose Aᵀ:\n' + t;
        return;
      }
      let det = 0;
      if (dim === 2) {
        det = m[0][0] * m[1][1] - m[0][1] * m[1][0];
        document.getElementById('mat-det').textContent = fmtNum(det, 4);
        if (det !== 0) {
          const inv = [[m[1][1] / det, -m[0][1] / det], [-m[1][0] / det, m[0][0] / det]];
          document.getElementById('mat-out').textContent = 'Inverse A⁻¹:\n' + inv.map(r => r.map(v => v.toFixed(3)).join('  ')).join('\n');
        } else document.getElementById('mat-out').textContent = 'Singular Matrix (No Inverse)';
      } else {
        det = m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
        document.getElementById('mat-det').textContent = fmtNum(det, 4);
        document.getElementById('mat-out').textContent = det === 0 ? 'Singular Matrix (det = 0)' : 'Non-Singular Invertible Matrix';
      }
    };
    setMatDim(3);
  };

  // 17. Quadratic Roots
  ToolSessions.quadratic = (vp) => {
    vp.innerHTML = `
      <div class="tool-session-wrap">
        <div class="session-hero">
          <div class="hero-sub">ax² + bx + c = 0 Roots</div>
          <div id="qd-roots" class="hero-val" style="font-size:20px;">x₁ = 2, x₂ = 3</div>
          <div class="hero-grid">
            <div class="hero-mini"><span>Discriminant (Δ)</span><strong id="qd-disc">1</strong></div>
            <div class="hero-mini"><span>Vertex (h, k)</span><strong id="qd-vert">(2.5, -0.25)</strong></div>
          </div>
        </div>
        <div class="g-card" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
          <div><label class="g-label">a</label><input id="qd-a" class="g-input" type="number" value="1" oninput="calcQuad()"></div>
          <div><label class="g-label">b</label><input id="qd-b" class="g-input" type="number" value="-5" oninput="calcQuad()"></div>
          <div><label class="g-label">c</label><input id="qd-c" class="g-input" type="number" value="6" oninput="calcQuad()"></div>
        </div>
      </div>`;
    window.calcQuad = () => {
      const a = parseFloat(document.getElementById('qd-a').value) || 1;
      const b = parseFloat(document.getElementById('qd-b').value) || 0;
      const c = parseFloat(document.getElementById('qd-c').value) || 0;
      const d = b * b - 4 * a * c;
      const h = -b / (2 * a), k = a * h * h + b * h + c;
      document.getElementById('qd-disc').textContent = fmtNum(d, 3);
      document.getElementById('qd-vert').textContent = `(${h.toFixed(2)}, ${k.toFixed(2)})`;
      if (d >= 0) {
        const r1 = (-b + Math.sqrt(d)) / (2 * a), r2 = (-b - Math.sqrt(d)) / (2 * a);
        document.getElementById('qd-roots').textContent = `x₁ = ${fmtNum(r1, 3)}, x₂ = ${fmtNum(r2, 3)}`;
      } else {
        const re = (-b / (2 * a)).toFixed(2), im = (Math.sqrt(-d) / (2 * a)).toFixed(2);
        document.getElementById('qd-roots').textContent = `${re} ± ${im}i`;
      }
    };
    calcQuad();
  };

  // 18. 2x2 Linear System
  ToolSessions.linear2 = (vp) => {
    vp.innerHTML = `
      <div class="tool-session-wrap">
        <div class="session-hero">
          <div class="hero-sub">Solution (x, y)</div>
          <div id="lin-res" class="hero-val">x = 2, y = 1</div>
        </div>
        <div class="g-card" style="display:flex;flex-direction:column;gap:10px;">
          <div class="g-label">Eq 1: a₁x + b₁y = c₁</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
            <input id="l-a1" class="g-input" type="number" value="2" oninput="calcLin2()">

            <input id="l-c2" class="g-input" type="number" value="7" oninput="calcLin2()">
          </div>
        </div>
      </div>`;
    window.calcLin2 = () => {
      const a1 = +document.getElementById('l-a1').value, b1 = +document.getElementById('l-b1').value, c1 = +document.getElementById('l-c1').value;
      const a2 = +document.getElementById('l-a2').value, b2 = +document.getElementById('l-b2').value, c2 = +document.getElementById('l-c2').value;

  ToolSessions.calculus = (vp) => {
    vp.innerHTML = `
      <div class="tool-session-wrap">

          <div class="hero-sub">Numerical Calculus Output</div>

          </div>
        </div>
        <div class="g-card" style="display:flex;flex-direction:column;gap:10px;">

          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
            <div><label class="g-label">Point x₀</label><input id="cal-x0" class="g-input" type="number" value="3" oninput="calcCalculus()"></div>
            <div><label class="g-label">Lower a</label><input id="cal-a" class="g-input" type="number" value="0" oninput="calcCalculus()"></div>
            <div><label class="g-label">Upper b</label><input id="cal-b" class="g-input" type="number" value="3" oninput="calcCalculus()"></div>

    window.calcCalculus = () => {

      const f = (x) => { try { return Function('x', 'return (' + expr + ')')(x); } catch (e) { return NaN; } };
      const x0 = +document.getElementById('cal-x0').value, a = +document.getElementById('cal-a').value, b = +document.getElementById('cal-b').value;

      let sum = f(a) + f(b);

      const integral = (dx / 3) * sum;
      document.getElementById('cal-der').textContent = isFinite(der) ? der.toFixed(4) : 'Error';
